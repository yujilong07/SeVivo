spring.application.name=uptime-monitor

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/monitor}
spring.datasource.username=${DB_USER:monitor}
spring.datasource.password=${DB_PASSWORD:monitor}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

monitor.check.interval-ms=${CHECK_INTERVAL_MS:60000}
monitor.check.connect-timeout-ms=${CONNECT_TIMEOUT_MS:3000}
monitor.check.request-timeout-ms=${REQUEST_TIMEOUT_MS:5000}

management.endpoints.web.exposure.include=health
server.port=${SERVER_PORT:8080}